name: ci

on:
  push:
    branches: [main]
  # Branches must clear the same bar as main BEFORE they merge: the offline
  # matrix (Linux + Windows, 3.11) and the live matrix (three Superset
  # versions) are exactly the checks a feature branch is most likely to break.
  # Deliberately unfiltered by base branch: a stacked PR (one that targets
  # another feature branch rather than main) would otherwise run no checks at
  # all, which is the case this trigger exists to prevent.
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The [mcp] extra allows mcp 1 and 2 (2 renamed FastMCP); test both.
        mcp: ["mcp<2", "mcp>=2,<3"]
    name: offline (${{ matrix.os }}, ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,mcp]" "${{ matrix.mcp }}"
      - run: pytest tests/ -q
      - run: python tools/params_drift.py --all

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        superset: ["4.1.4", "5.0.0", "6.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Boot Superset ${{ matrix.superset }} sandbox
        run: bash sandbox/up.sh --tag "${{ matrix.superset }}" 8098
      - name: Kitchen-sink apply + slice-id stability
        run: python tools/ci_live_check.py --base-url http://localhost:8098 --spec tests/fixtures/kitchen_sink.json
      # The display and dashboard controls fixtures, pointed at Superset's
      # example data, so every chart and filter control applies for real.
      - name: Display-controls apply + slice-id stability
        if: ${{ !cancelled() }}
        run: python tools/ci_live_check.py --base-url http://localhost:8098 --spec tests/fixtures/live_display_controls.json
      - name: Dashboard-controls apply + slice-id stability
        if: ${{ !cancelled() }}
        run: python tools/ci_live_check.py --base-url http://localhost:8098 --spec tests/fixtures/live_dashboard_controls.json
      # Standards content: standards apply writes an org footer, a team header and CSS
      # blocks, the spec applies, plan stays clean and decompile reads the markers back.
      - name: Standards content apply + round trip
        if: ${{ !cancelled() }}
        run: python tools/ci_live_standards.py --base-url http://localhost:8098
      - name: Lifecycle soak (25 cycles)
        run: python tools/soak.py --base-url http://localhost:8098 --cycles 25 --seed 7
      - name: Second-writer adversary
        run: python tools/adversary.py --base-url http://localhost:8098
      - name: Fault injection
        run: python tools/faultline.py --base-url http://localhost:8098
